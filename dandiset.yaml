description: Animals often make the same choice in different tasks, guided by different
  cues or expressed through different movements. Shared representations can support
  generalization across tasks, whereas task-specific representations can reduce interference1–3.
  Previous studies have revealed varying degrees of sharing in cortical choice codes4–7.
  How single neurons contribute to shared and task-specific readouts of a choice,
  and whether they do so in the same way in different areas and species, is unclear.
  Here we show that in mouse parietal and monkey frontal cortex, choice neurons span
  a continuum from preserving their choice preference across tasks to losing or reversing
  it. Neurons that kept their preference supported a choice readout that transferred
  across tasks, whereas neurons that lost or reversed it contributed to the interaction
  between choice and task. This relationship appeared in both species, across changes
  in sensory modality in mice and eye-movement type in monkeys. Recurrent networks
  trained on many tasks8 developed the same continuum, and the share of units at each
  end varied with how the tasks related. These results show how one cortical population
  can carry shared and task-specific codes for the same choice, and identify the relationship
  between tasks as a determinant of their balance in networks.
