description: Two-photon calcium imaging of mouse parietal cortex during performance
  of multiple decision-making tasks in the same session (visual, audio, multisensory).
  39  imaging sessions (GCaMP6s, CaMKII-tTA x GCaMP6s mice, 7 mice) from posterior
  parietal cortex at 150–350 µm depth, imaged at 15.1 Hz while mice ran through a
  virtual-reality T-maze. In blocks of trials, mice turned left or right according
  to a visual cue (Gabor patch at 0° or 90°), an auditory cue (sound from the left
  or right speaker), or both cues together (congruent). Each NWB file holds suite2p
  ROIs, raw and neuropil fluorescence, dF/F and deconvolved activity, per-frame VR
  position, velocity and view angle, a trial table with cue, choice, outcome and context,
  and context blocks as epochs. Raw imaging movies are not included.
